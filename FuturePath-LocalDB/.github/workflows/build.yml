name: Build and test Future Path
on: [push, pull_request, workflow_dispatch]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - shell: pwsh
        run: |
          $instances = sqllocaldb info
          if ($instances -notcontains 'MSSQLLocalDB') { sqllocaldb create MSSQLLocalDB }
          sqllocaldb start MSSQLLocalDB
      - run: dotnet restore FuturePath.sln --locked-mode
      - run: dotnet build FuturePath.sln -c Release --no-restore
      - run: dotnet test FuturePath.sln -c Release --no-build --logger trx --results-directory TestResults
      - run: dotnet publish src/FuturePath.Desktop -c Release -r win-x64 --self-contained true -o artifacts/windows
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FuturePath-Windows-and-TestResults
          path: |
            artifacts/windows
            TestResults
